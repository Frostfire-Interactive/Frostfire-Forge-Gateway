<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zone Map</title>
    <!-- The look every tool window shares, then what only the zone map has: its canvas and its details panel. -->
    <link rel="stylesheet" href="./css/tools.css" />
    <link rel="stylesheet" href="./css/zonemap.css" />
    <script defer src="./js/core/zonemap.js" type="text/javascript"></script>
  </head>
  <body>
    <!-- The frame of a tool window; js/core/zonemap.ts fills it in. -->
    <div class="tl-app zm-app">
      <!-- The map's zones. -->
      <aside id="zm-side" class="tl-side zm-side" aria-label="Zones"></aside>
      <div class="tl-main">
        <!-- The map, whether its zones are saved, and undo, redo and save. -->
        <header id="zm-topbar" class="tl-topbar"></header>
        <div id="tl-banner" class="tl-banner" role="status" hidden></div>
        <!-- The tools, each with the key that picks it. -->
        <div id="zm-toolbar" class="zm-toolbar" role="toolbar" aria-label="Tools"></div>
        <!-- The whole map with its zones, and the details of the zone selected. -->
        <main id="zm-page" class="tl-page zm-page"></main>
      </div>
    </div>
    <!-- What came of what was asked for, shown for a few seconds. -->
    <div id="tl-toasts" class="tl-toasts"></div>
    <noscript>The zone map needs JavaScript.</noscript>
  </body>
</html>
