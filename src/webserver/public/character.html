<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <link rel="icon" type="image/ico" href="img/icons/favicon.ico">
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">
        <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="theme-color" content="#1e120a">
        <title>Frostfire Forge - Create Your Character</title>
        <link rel="stylesheet" href="css/frontend.css">
        <link rel="stylesheet" href="css/character.css">
        <script src="./js/web/notification.js"></script>
    </head>
    <body class="character-page">
        <div class="cc-world" aria-hidden="true">
            <img id="start-area" class="cc-world-picture" alt="">
        </div>

        <!-- A full-screen character creation screen over the world: the classes on the left, the chosen class's details
             on the right, the world open between them, the Create button floating at the foot. -->
        <div class="cc-screen">
            <main class="cc-stage">
                <section class="cc-panel cc-roster" aria-labelledby="cc-roster-title">
                    <h2 class="cc-panel-title" id="cc-roster-title">Choose a class</h2>
                    <div id="class-list" class="cc-class-list" role="listbox" aria-labelledby="cc-roster-title">
                        <div class="cc-loading">Loading classes...</div>
                    </div>
                </section>

                <section class="cc-panel cc-info" aria-label="Class details">
                    <div class="cc-info-scroll">
                        <div id="class-hero" class="cc-hero" aria-live="polite"></div>
                        <div id="class-details" class="cc-details"></div>
                    </div>
                </section>
            </main>

            <div class="cc-notices">
                <div id="error-message" class="cc-error" role="alert"></div>
                <div id="starts-over" class="cc-warning" hidden>
                    <div class="cc-warning-words">
                        <strong>Your current character starts over</strong>
                        <span>It goes back to level 1 with the class's stats. Its items, equipment, bags, spells, quests, gold and home are gone. Friends, mounts and settings stay.</span>
                    </div>
                    <label id="starts-over-confirm" class="cc-confirm" hidden>
                        <input type="checkbox" id="starts-over-checkbox">
                        <span>I understand</span>
                    </label>
                </div>
            </div>

            <div class="cc-actions">
                <button type="button" id="create-button" class="cc-button cc-create" disabled>Create</button>
            </div>
        </div>

        <script src="./js/web/character.js"></script>
        <script src="./js/web/startarea.js"></script>
    </body>
</html>
