<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mount Editor</title>
    <!-- The look every tool window shares. -->
    <link rel="stylesheet" href="./css/tools.css" />
    <script defer src="./js/core/mounteditorbridge.js" type="text/javascript"></script>
  </head>
  <body>
    <!-- The workbench every editor uses; js/core/tooleditor.ts fills it in. -->
    <div class="tl-app tl-app-editor">
      <!-- Every mount. -->
      <aside id="tl-side" class="tl-side"></aside>
      <div class="tl-main">
        <header id="tl-topbar" class="tl-topbar"></header>
        <div id="tl-banner" class="tl-banner" role="status" hidden></div>
        <div id="tl-tabs" class="tl-tabs" hidden></div>
        <main id="tl-page" class="tl-page"></main>
      </div>
    </div>
    <div id="tl-toasts" class="tl-toasts"></div>
    <noscript>The mount editor needs JavaScript.</noscript>
  </body>
</html>
